[package]
name = "murmr"
version = "0.1.72"
description = "Murmr — privacy-first local voice dictation"
authors = ["Murmr"]
edition = "2021"

[lib]
name = "murmr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tuned release profile. LTO is the big one — whisper.cpp's FFI calls
# get inlined across the boundary, which roughly 2× speeds up
# transcribe time on the same model.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables Ctrl+Shift+I in release builds. Useful while we're
# beta-testing — a future v1.0 should drop this so end users can't crack
# open the JS console.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Enforce a single running instance. Two Murmr processes install two
# global keyboard hooks AND two independent audio-duck managers that
# race on per-app volume (one ducks + saves "original", the other ducks
# over the already-ducked value + saves THAT as original; on release
# they fight and the user's audio never returns). The plugin makes the
# second launch hand its argv to the first instance and exit.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture + processing
cpal = "0.15"
rubato = "0.16"
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# Local Whisper transcription.
# - `raw-api` re-exports whisper-rs-sys so we can hook ggml's own logging
#   callback (CPU feature detection + threading info).
# - `openmp` is the BIG one: without it, whisper.cpp falls back to a
#   single-threaded path inside the inner GEMM loops. CPU-bound transcribe
#   takes ~5-7× longer (e.g. 7200ms vs 1200ms for 3s audio on a Ryzen 9
#   5900X). Note this requires libgomp/MSVC OpenMP runtime to be present
#   on the user's machine — modern Windows + macOS already ship it.
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api", "openmp"] }

# Global hotkey (rdev fires on bare modifiers; tauri-plugin-global-shortcut
# does not). See plan §13 #5.
# `unstable_grab` enables `rdev::grab()` (vs `listen()` which is observation-
# only), so we can SUPPRESS the keypress when it matches a bound dictation
# key — otherwise binding to e.g. `~` types tildes into the focused app on
# every press.
rdev = { version = "0.5", features = ["unstable_grab"] }

# Clipboard + keystroke synthesis for text injection
arboard = "3"
enigo = "0.6"

# Persistent storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Logging + utility
log = "0.4"
parking_lot = "0.12"
thiserror = "2"
crossbeam-channel = "0.5"
regex = "1"

# ---- Engine: in-app model download (session A) ----
# reqwest/rustls are already in the tree via tauri-plugin-updater; we reuse
# the same versions + TLS setup (ring provider) so this adds ~no build time.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# ---- end engine block ----

# Win32 APIs for HUD positioning (focus module).
# - windows-sys: lightweight legacy bindings (GetGUIThreadInfo, GetForegroundWindow)
# - windows:     full COM bindings for UI Automation (modern apps' focused element)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

# ---- Engine (GPU / model download) — session A ----
# macOS Apple Silicon: Metal GPU for Whisper. Previously disabled because
# ggml-metal's `@available(...)` checks emit `__isPlatformVersionAtLeast`, a
# compiler-rt builtin that rustc's `-nodefaultlibs` link line leaves out.
# build.rs now adds `libclang_rt.osx.a` explicitly on macOS, which resolves it.
# Intel Macs stay on CPU (Metal there is slower/less tested; Accelerate+AVX is
# fine for base.en).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api", "metal"] }
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api"] }
# Windows: Vulkan GPU backend (NVIDIA / AMD / Intel). Building needs the
# LunarG Vulkan SDK (`VULKAN_SDK` env var; scripts/run-tauri.mjs auto-detects
# it). At runtime the bundled Khronos loader (runtime/windows/vulkan-1.dll)
# guarantees the exe starts even on machines with no GPU driver; with no usable
# device ggml simply reports zero Vulkan devices and Murmr runs on CPU.
[target.'cfg(windows)'.dependencies.whisper-rs]
version = "0.16"
default-features = false
features = ["raw-api", "openmp", "vulkan"]
# ---- end engine block ----

[target.'cfg(target_os = "macos")'.dependencies]
# Used by focus/macos.rs to query the AXUIElement of the focused text field
# and the main NSScreen's backingScaleFactor for points→pixels conversion.
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"

# Local patch: rdev 0.5.3 calls TSMGetInputSourceProperty inside its
# CGEventTap callback (on a non-main thread). On macOS 26+, dispatch_assert_queue
# crashes the app on the first key event. Vendored copy nulls out
# create_string_for_key in that path; Murmr only reads `event_type`, never `name`.
[patch.crates-io]
rdev = { path = "../vendor-rdev" }
